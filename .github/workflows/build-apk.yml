name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip wget curl \
          openjdk-17-jdk \
          python3-pip python3-venv \
          libffi-dev libssl-dev \
          autoconf automake libtool \
          build-essential ccache \
          libncurses5 libncurses5-dev \
          zlib1g-dev libltdl-dev

    - name: Install Buildozer + Cython
      run: |
        pip install --upgrade pip wheel
        pip install buildozer cython==0.29.33

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3
        restore-keys: buildozer-${{ runner.os }}-

    - name: Cache Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-sdk-${{ runner.os }}-v3

    - name: Build APK
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TajikDialect-APK
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30
