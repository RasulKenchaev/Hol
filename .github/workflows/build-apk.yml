name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip \
          openjdk-17-jdk \
          python3-pip python3-venv \
          libffi-dev libssl-dev \
          autoconf automake libtool \
          build-essential ccache \
          libncurses5 libncurses5-dev \
          zlib1g-dev libltdl-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          libgl1-mesa-dev libgles2-mesa-dev

    - name: Install Buildozer + Cython
      run: |
        pip install --upgrade pip wheel
        pip install buildozer==1.5.0 cython==0.29.33

    - name: Cache Buildozer global dir
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v2
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Cache Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-sdk-${{ runner.os }}-v2

    - name: Build APK (debug)
      run: |
        set -e
        export PATH="$PATH:$HOME/.local/bin"
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: TajikDialect-APK
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Show APK info
      if: always()
      run: |
        echo "=== bin/ contents ==="
        ls -lh bin/ 2>/dev/null || echo "bin/ папка нест"
