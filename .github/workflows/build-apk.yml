name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Cache Buildozer global dir
      uses: actions/cache@v4
      with:
        path: .buildozer_cache
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v4
        restore-keys: buildozer-${{ runner.os }}-

    - name: Build APK with Docker (kivy/buildozer)
      run: |
        docker run --rm \
          -v "$PWD":/home/user/hostcwd \
          -v "$PWD/.buildozer_cache":/home/user/.buildozer \
          kivy/buildozer:latest \
          android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TajikDialect-APK
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30
